<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">AWS incident triage agent architecture</title>
  <desc id="desc">Amazon ECS sends structured logs to CloudWatch. Read-only collectors gather ECS and log evidence for an OpenAI agent, which writes a Markdown root-cause analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#72e0a8"/>
    </marker>
  </defs>
  <rect width="1400" height="380" rx="24" fill="url(#bg)"/>
  <text x="70" y="63" fill="#f7fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Evidence-first, read-only investigation path</text>
  <text x="70" y="94" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="16">Fixed targets • bounded inputs • no mutation tools • human-reviewed output</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="65" y="145" width="210" height="135" rx="18" fill="#1d2b44" stroke="#ffad66" stroke-width="2"/>
    <text x="170" y="198" text-anchor="middle" fill="#ffad66" font-size="18" font-weight="700">Amazon ECS</text>
    <text x="170" y="229" text-anchor="middle" fill="#d8e1ee" font-size="15">service • deployments</text>
    <text x="170" y="253" text-anchor="middle" fill="#d8e1ee" font-size="15">events • task health</text>

    <rect x="345" y="145" width="210" height="135" rx="18" fill="#1d2b44" stroke="#ffad66" stroke-width="2"/>
    <text x="450" y="198" text-anchor="middle" fill="#ffad66" font-size="18" font-weight="700">CloudWatch</text>
    <text x="450" y="229" text-anchor="middle" fill="#d8e1ee" font-size="15">structured JSON logs</text>
    <text x="450" y="253" text-anchor="middle" fill="#d8e1ee" font-size="15">bounded error window</text>

    <rect x="625" y="145" width="230" height="135" rx="18" fill="#173344" stroke="#72e0a8" stroke-width="2"/>
    <text x="740" y="193" text-anchor="middle" fill="#72e0a8" font-size="18" font-weight="700">Read-only collectors</text>
    <text x="740" y="224" text-anchor="middle" fill="#d8e1ee" font-size="15">5 approved AWS reads</text>
    <text x="740" y="248" text-anchor="middle" fill="#d8e1ee" font-size="15">redact • cap • correlate</text>

    <rect x="925" y="145" width="210" height="135" rx="18" fill="#20284a" stroke="#9d9cff" stroke-width="2"/>
    <text x="1030" y="198" text-anchor="middle" fill="#b9b8ff" font-size="18" font-weight="700">OpenAI agent</text>
    <text x="1030" y="229" text-anchor="middle" fill="#d8e1ee" font-size="15">evidence synthesis</text>
    <text x="1030" y="253" text-anchor="middle" fill="#d8e1ee" font-size="15">facts ≠ hypotheses</text>

    <rect x="1205" y="145" width="130" height="135" rx="18" fill="#173344" stroke="#72e0a8" stroke-width="2"/>
    <text x="1270" y="199" text-anchor="middle" fill="#72e0a8" font-size="19" font-weight="700">RCA</text>
    <text x="1270" y="229" text-anchor="middle" fill="#d8e1ee" font-size="15">Markdown</text>
    <text x="1270" y="253" text-anchor="middle" fill="#d8e1ee" font-size="15">human review</text>
  </g>

  <g stroke="#72e0a8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M275 212 H335"/>
    <path d="M555 212 H615"/>
    <path d="M855 212 H915"/>
    <path d="M1135 212 H1195"/>
  </g>
  <text x="310" y="196" text-anchor="middle" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="12">logs</text>
  <text x="590" y="196" text-anchor="middle" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="12">read</text>
  <text x="885" y="196" text-anchor="middle" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="12">tools</text>
  <text x="1165" y="196" text-anchor="middle" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="12">write</text>
  <text x="700" y="338" text-anchor="middle" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="14">No path points back to AWS: mitigation is advisory and never executed.</text>
</svg>
