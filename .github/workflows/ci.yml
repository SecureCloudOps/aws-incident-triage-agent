name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            triage-agent/requirements.txt
            buggy-service/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-dev.txt \
            -r triage-agent/requirements.txt \
            -r buggy-service/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q buggy-service triage-agent tests

      - name: Audit Python dependencies
        run: |
          pip-audit --requirement triage-agent/requirements.txt
          pip-audit --requirement buggy-service/requirements.txt

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=infrastructure/terraform validate

  container:
    name: Demo container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned demo image
        run: docker build --pull --tag aws-incident-triage-demo:ci buggy-service
